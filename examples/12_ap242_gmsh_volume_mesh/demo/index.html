<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人 × Agent 参数化 CAD 建模 · 会话回放 Demo</title><style>:root {
  --bg: #0b0f18;
  --bg2: #10151f;
  --panel: #131926;
  --panel2: #182032;
  --line: #232d42;
  --ink: #dbe4f3;
  --ink-dim: #8b97ad;
  --ink-faint: #5d6980;
  --accent: #4cc2ff;
  --accent2: #ffb454;
  --ok: #3fd68f;
  --err: #ff6b6b;
  --user: linear-gradient(135deg, #2b7bd4, #1f5aa8);
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 14px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 10px 18px; background: linear-gradient(180deg, #111827, #0d1220);
  border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  width: 40px; height: 40px; border-radius: 10px; flex: none;
  background: linear-gradient(135deg, #1c3d63, #122844);
  border: 1px solid #2c5f96; color: #7fc4ff;
  display: flex; align-items: center; justify-content: center;
  font: 700 13px/1 var(--mono); letter-spacing: .5px;
  box-shadow: 0 0 18px rgba(76, 194, 255, .18) inset;
}
.titles h1 { font-size: 15px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
.titles h1 em { font-style: normal; color: var(--accent); }
.titles .sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  background: none; border: none; color: var(--ink-dim); font: 600 12px/1 inherit;
  padding: 7px 12px; cursor: pointer; transition: .15s;
}
.seg button:hover { color: var(--ink); }
.seg button.on { background: #1d3355; color: var(--accent); }
.tgl {
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-faint);
  border-radius: 8px; padding: 7px 10px; font: 600 12px/1 inherit; cursor: pointer;
}
.tgl.on { color: var(--ink); border-color: #35507c; background: var(--panel2); }
#playBtn {
  border: 1px solid #2c6fae; background: linear-gradient(135deg, #2273c2, #1a548f);
  color: #eaf6ff; border-radius: 8px; padding: 7px 16px; font: 650 12.5px/1 inherit; cursor: pointer;
}
#playBtn:hover { filter: brightness(1.15); }
#nextBtn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-dim);
  border-radius: 8px; padding: 7px 12px; font: 600 12.5px/1 inherit; cursor: pointer;
}
#nextBtn:hover { color: var(--ink); border-color: #35507c; }

/* ---------- scrubber ---------- */
#scrubRow {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 18px; background: #0d1220; border-bottom: 1px solid var(--line);
  font: 600 11.5px/1 var(--mono); color: var(--ink-faint);
}
#scrubStat { min-width: 190px; white-space: nowrap; }
#scrubStat b { color: var(--accent); font-weight: 650; }
#stageChip {
  border: 1px solid #2e4a6d; color: #86c7f5; border-radius: 6px; padding: 3px 8px;
  background: #12233a; white-space: nowrap;
}
#scrub { position: relative; flex: 1; height: 22px; cursor: pointer; }
#scrubTrack {
  position: absolute; left: 0; right: 0; top: 9px; height: 4px;
  background: #1d2840; border-radius: 2px; overflow: hidden;
}
#scrubFill { height: 100%; width: 0; background: linear-gradient(90deg, #2b7bd4, #4cc2ff); border-radius: 2px; }
.mark {
  position: absolute; top: 5px; width: 3px; height: 12px; border-radius: 2px;
  background: #3d5f8f; cursor: pointer;
}
.mark:hover, .mark.lit { background: var(--accent2); box-shadow: 0 0 6px rgba(255, 180, 84, .7); }
#scrubTip {
  position: absolute; bottom: 24px; transform: translateX(-50%); display: none;
  background: #0a0e17; border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 11px; font: 500 11.5px/1.5 -apple-system, "PingFang SC", sans-serif;
  color: var(--ink); white-space: nowrap; max-width: 480px; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .5); z-index: 60; pointer-events: none;
}
#scrubTip .t { color: var(--ink-faint); font-size: 10.5px; }

/* ---------- layout ---------- */
main { flex: 1; display: flex; min-height: 0; }
#chatWrap { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
#chat { flex: 1; overflow-y: auto; padding: 22px 26px 90px; scroll-behavior: auto; }
#chat::-webkit-scrollbar, .panebody::-webkit-scrollbar { width: 10px; }
#chat::-webkit-scrollbar-thumb, .panebody::-webkit-scrollbar-thumb { background: #26314a; border-radius: 5px; }
#followPill {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: #1d3355; border: 1px solid #2c6fae; color: #bfe0ff; border-radius: 999px;
  padding: 8px 18px; font: 650 12.5px/1 inherit; cursor: pointer; display: none;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .45); z-index: 30;
}

/* ---------- session card ---------- */
#sessionCard {
  max-width: 860px; margin: 4px auto 18px; background: linear-gradient(135deg, #121a2c, #0f1524);
  border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px;
}
#sessionCard h2 { font-size: 16.5px; margin-bottom: 4px; }
#sessionCard .sid { font: 500 11.5px/1 var(--mono); color: var(--ink-faint); margin-bottom: 14px; }
.statGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.stat {
  background: #0d1424; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px 8px;
}
.stat b { display: block; font: 700 17px/1.2 var(--mono); color: var(--accent); }
.stat.err b { color: var(--accent2); }
.stat span { font-size: 10.5px; color: var(--ink-faint); }

/* ---------- messages ---------- */
.msg { max-width: 860px; margin: 0 auto 14px; animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .who { display: flex; align-items: center; gap: 8px; font: 650 11.5px/1 inherit; color: var(--ink-dim); margin-bottom: 5px; }
.turnChip {
  background: #233451; border: 1px solid #33517c; color: #9ecbff; border-radius: 6px;
  padding: 2px 8px; font: 650 10.5px/1.4 var(--mono);
}
.bubble {
  background: var(--user); color: #f2f9ff; border-radius: 14px 14px 4px 14px;
  padding: 11px 15px; max-width: 86%; box-shadow: 0 4px 16px rgba(31, 90, 168, .25);
  white-space: pre-wrap; word-break: break-word;
}
.bubble .caret { display: inline-block; width: 2px; height: 1em; background: #fff; vertical-align: -2px; animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.msg.asst .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.avatar {
  width: 26px; height: 26px; border-radius: 8px; flex: none;
  background: linear-gradient(135deg, #2d3a55, #1c2740); border: 1px solid #3a4c72;
  color: #ffd9a0; font: 700 11px/26px var(--mono); text-align: center;
}
.aname { font: 650 12px/1 inherit; color: var(--ink-dim); }
.modeltag { font: 500 10.5px/1 var(--mono); color: var(--ink-faint); }
.mtime { font: 500 10.5px/1 var(--mono); color: var(--ink-faint); margin-left: auto; }
.rbadge { border-radius: 6px; padding: 2.5px 9px; font: 650 10.5px/1.5 inherit; }
.r-req   { background: #3a2b12; color: #ffc46b; border: 1px solid #6b4d1e; }
.r-plan  { background: #12303f; color: #6fd3ff; border: 1px solid #1e5b75; }
.r-build { background: #163323; color: #6fe0a0; border: 1px solid #236347; }
.r-ver   { background: #30203f; color: #c9a0ff; border: 1px solid #54357a; }
.r-other { background: #262c3a; color: var(--ink-dim); border: 1px solid var(--line); }

.rolebanner {
  max-width: 860px; margin: 20px auto; text-align: center; animation: rise .28s ease both;
}
.rolebanner .pill {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
  background: #101a2e; border: 1px dashed #35507c; border-radius: 999px; padding: 7px 16px;
  font: 650 12.5px/1.5 inherit; color: #9ecbff;
}
.rolebanner .meta { font: 500 11px/1.7 var(--mono); color: var(--ink-faint); margin-top: 5px; }
.rolebanner .meta code { color: #7fa3c8; }

/* ---------- blocks ---------- */
.blk { margin: 7px 0; }
details.blk-think, details.blk-skill {
  border: 1px solid #202a41; border-radius: 10px; background: #0e1422; overflow: hidden;
}
details.blk-think summary, details.blk-skill summary {
  cursor: pointer; list-style: none; padding: 7px 12px;
  font: 600 11.5px/1.6 inherit; color: var(--ink-faint); user-select: none;
}
details.blk-think summary::before { content: "🧠 "; }
details.blk-skill summary::before { content: "📄 "; }
details.blk-think summary:hover, details.blk-skill summary:hover { color: var(--ink-dim); }
details.blk-think[open] summary, details.blk-skill[open] summary { border-bottom: 1px solid #1c2740; }
.thinkbody, .skillbody { padding: 10px 14px; font-size: 12.5px; color: #9aa8c0; max-height: 340px; overflow: auto; }

.md { font-size: 13.5px; }
.md h1, .md h2, .md h3, .md h4 { font-size: 13.5px; margin: 12px 0 6px; color: #cfe2ff; }
.md h1 { font-size: 15px; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0 6px 20px; }
.md li { margin: 3px 0; }
.md code {
  font: 500 12px/1.5 var(--mono); background: #1a2337; color: #9fd0ff;
  border-radius: 5px; padding: 1px 6px;
}
.md blockquote {
  border-left: 3px solid #2e4a6d; padding: 2px 12px; margin: 8px 0;
  color: #a6b4cc; background: #0f1626; border-radius: 0 8px 8px 0;
}
.md table { border-collapse: collapse; margin: 10px 0; font-size: 12px; max-width: 100%; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid #26324c; padding: 5px 10px; text-align: left; }
.md th { background: #16203a; color: #b9d4f5; }
.md hr { border: none; border-top: 1px solid #1f2a40; margin: 10px 0; }

.toolcard {
  border: 1px solid #202b42; border-left: 3px solid #2b5f8f; border-radius: 10px;
  background: #0e1524; overflow: hidden;
}
.toolcard.st-error { border-left-color: var(--err); }
.toolcard .trow {
  display: flex; align-items: center; gap: 9px; padding: 8px 12px; cursor: pointer; user-select: none;
}
.toolcard .trow:hover { background: #121b2e; }
.tico { font-size: 13px; width: 18px; text-align: center; flex: none; }
.tname { font: 650 12px/1 var(--mono); color: #86b8e8; }
.tstat { font: 650 10px/1 var(--mono); border-radius: 5px; padding: 2.5px 7px; flex: none; }
.st-completed { background: #11301f; color: var(--ok); border: 1px solid #1d5b3d; }
.st-error { background: #3a1616; color: var(--err); border: 1px solid #6b2424; }
.tsum {
  flex: 1; min-width: 0; font: 500 11.5px/1.5 var(--mono); color: var(--ink-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tlen { font: 500 10.5px/1 var(--mono); color: var(--ink-faint); flex: none; }
.chev { color: var(--ink-faint); font-size: 10px; flex: none; transition: transform .15s; }
.toolcard.open .chev { transform: rotate(90deg); }
.toolbody { display: none; border-top: 1px solid #1c2740; }
.toolcard.open .toolbody { display: block; }
.codebox { position: relative; }
.codebox .lab {
  position: sticky; top: 0; display: flex; justify-content: space-between;
  background: #101a2e; color: #6d87ab; border-bottom: 1px solid #1a2438;
  font: 650 10px/1 var(--mono); padding: 5px 12px;
}
.codebox pre {
  font: 500 11.5px/1.6 var(--mono); color: #b7c6dd; padding: 10px 14px;
  overflow: auto; max-height: 380px; white-space: pre-wrap; word-break: break-word;
}
.pill-patch {
  display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap;
  border: 1px solid #223049; background: #0e1626; border-radius: 8px;
  padding: 5px 11px; font: 500 11px/1.6 var(--mono); color: var(--ink-dim); margin: 4px 0;
}
.pill-patch .h { color: #c9a0ff; }
.pill-patch .f { color: #8fb0d4; }

/* typing indicator */
.typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: #cfe2ff; animation: tp 1s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; }
.typing i:nth-child(3) { animation-delay: .36s; }
@keyframes tp { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* ---------- side panel ---------- */
#side {
  width: 430px; flex: none; border-left: 1px solid var(--line); background: #0d1220;
  display: flex; flex-direction: column; min-height: 0;
}
#tabs { display: flex; border-bottom: 1px solid var(--line); }
#tabs button {
  flex: 1; background: none; border: none; color: var(--ink-faint); cursor: pointer;
  font: 600 12px/1 inherit; padding: 11px 4px; border-bottom: 2px solid transparent;
}
#tabs button:hover { color: var(--ink-dim); }
#tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabpanes { flex: 1; min-height: 0; position: relative; }
.pane { position: absolute; inset: 0; display: none; flex-direction: column; }
.pane.on { display: flex; }
.panebody { flex: 1; overflow-y: auto; padding: 14px; }

#glWrap { flex: 1; min-height: 0; position: relative; background: radial-gradient(120% 90% at 50% 10%, #16203a 0%, #0a0e18 70%); }
#gl { width: 100%; height: 100%; display: block; cursor: grab; }
#gl:active { cursor: grabbing; }
#glHint {
  position: absolute; left: 12px; bottom: 10px; font: 500 10.5px/1 var(--mono);
  color: var(--ink-faint); background: rgba(10, 14, 24, .6); padding: 5px 9px; border-radius: 6px;
  pointer-events: none;
}
#glLoad {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--ink-faint); font: 600 12px/1 inherit;
}
#glBar {
  display: flex; gap: 7px; flex-wrap: wrap; padding: 9px 12px; border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line); background: #0f1524;
}
#glBar button {
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-dim); border-radius: 7px;
  font: 600 11.5px/1 inherit; padding: 6px 11px; cursor: pointer;
}
#glBar button:hover { color: var(--ink); border-color: #35507c; }
#glBar button.on { color: var(--accent); border-color: #2c6fae; background: #12233c; }
#glCap { padding: 8px 13px; font: 500 11px/1.6 var(--mono); color: var(--ink-faint); }

.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rgrid figure { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0f1626; cursor: zoom-in; }
.rgrid img { width: 100%; display: block; }
.rgrid figcaption { font: 500 11px/1 inherit; color: var(--ink-faint); padding: 7px 9px; }

.ptable { width: 100%; border-collapse: collapse; font-size: 12px; }
.ptable th, .ptable td { border-bottom: 1px solid #1b2540; padding: 6.5px 8px; text-align: left; vertical-align: top; }
.ptable th { color: #8fb0d4; font: 650 11px/1.5 var(--mono); white-space: nowrap; }
.ptable td.k { font: 650 11.5px/1.6 var(--mono); color: var(--accent); white-space: nowrap; }
.ptable td.v { font: 650 11.5px/1.6 var(--mono); color: #ffd9a0; white-space: nowrap; }
.ptable td.c { color: var(--ink-dim); }
.secttl { font: 700 12.5px/1 inherit; color: #cfe2ff; margin: 16px 0 8px; }
.secttl:first-child { margin-top: 2px; }
.tagchip {
  display: inline-block; font: 650 10.5px/1.7 var(--mono); color: #6fe0a0;
  background: #10281c; border: 1px solid #1f5b3d; border-radius: 6px; padding: 1px 8px; margin: 2px 4px 2px 0;
}
.filelist { font: 500 11.5px/1.9 var(--mono); color: var(--ink-dim); }
.filelist b { color: #9ecbff; font-weight: 650; }
.filelist .sz { color: var(--ink-faint); }
.about p { margin: 8px 0; font-size: 12.5px; color: var(--ink-dim); }
.about li { margin: 5px 0 5px 18px; font-size: 12.5px; color: var(--ink-dim); }
.about b { color: var(--ink); }
.kbd {
  font: 600 11px/1 var(--mono); background: #1a2337; border: 1px solid #2c3a58;
  border-bottom-width: 2px; border-radius: 5px; padding: 2px 7px; color: #b9d4f5;
}

#lightbox {
  position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
  background: rgba(5, 8, 14, .88); cursor: zoom-out;
}
#lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 10px; }

@media (max-width: 1180px) {
  #side { position: fixed; right: 0; top: 0; bottom: 0; z-index: 70; transform: translateX(100%); transition: transform .25s; box-shadow: -12px 0 40px rgba(0,0,0,.5); }
  #side.show { transform: none; }
  #sideToggle { display: flex !important; }
}
#sideToggle {
  display: none; position: fixed; right: 16px; bottom: 16px; z-index: 80;
  align-items: center; gap: 7px; border: 1px solid #2c6fae; background: #14304f; color: #bfe0ff;
  border-radius: 999px; padding: 10px 16px; font: 650 12.5px/1 inherit; cursor: pointer;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
}
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <div class="logo">SCA</div>
    <div class="titles">
      <h1>人 × Agent 参数化 CAD 建模 <em>· 会话忠实回放</em></h1>
      <div class="sub" id="metaLine"></div>
    </div>
  </div>
  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-m="replay" class="on">回放模式</button>
      <button data-m="read">阅读模式</button>
    </div>
    <div class="seg" id="speedSeg">
      <button data-s="0.5">×0.5</button>
      <button data-s="1" class="on">×1</button>
      <button data-s="2">×2</button>
      <button data-s="4">×4</button>
      <button data-s="99">∞</button>
    </div>
    <button class="tgl on" id="tglThink">🧠 思考</button>
    <button class="tgl on" id="tglOut">🔧 输出</button>
    <button id="nextBtn">⏭ 下一轮</button>
    <button id="playBtn">▶ 播放</button>
  </div>
</header>

<div id="scrubRow">
  <div id="scrubStat"></div>
  <div id="stageChip">S0</div>
  <div id="scrub">
    <div id="scrubTrack"><div id="scrubFill"></div></div>
    <div id="scrubTip"></div>
  </div>
</div>

<main>
  <section id="chatWrap">
    <div id="chat">
      <div id="sessionCard"></div>
    </div>
    <div id="followPill">↓ 回到最新</div>
  </section>

  <aside id="side">
    <nav id="tabs">
      <button data-t="3d" class="on">🧊 3D 模型</button>
      <button data-t="renders">🖼 渲染图</button>
      <button data-t="params">⚙ 参数</button>
      <button data-t="out">📦 产物</button>
      <button data-t="about">ℹ 关于</button>
    </nav>
    <div class="tabpanes">
      <div class="pane on" id="tab-3d">
        <div id="glBar">
          <button data-a="rotate" class="on">⟳ 自转</button>
          <button data-a="iso">等轴</button>
          <button data-a="front">正视</button>
          <button data-a="top">俯视</button>
          <button data-a="wire">线框</button>
          <button data-a="reset">重置</button>
        </div>
        <div id="glWrap">
          <canvas id="gl"></canvas>
          <div id="glLoad">正在装配 3D 模型…</div>
          <div id="glHint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
        </div>
        <div id="glCap"></div>
      </div>
      <div class="pane" id="tab-renders"><div class="panebody"><div class="rgrid" id="rgrid"></div></div></div>
      <div class="pane" id="tab-params"><div class="panebody"></div></div>
      <div class="pane" id="tab-out"><div class="panebody"></div></div>
      <div class="pane" id="tab-about"><div class="panebody"></div></div>
    </div>
  </aside>
</main>

	// This set of controls performs orbiting, dollying (zooming), and panning.
	// Unlike TrackballControls, it maintains the "up" direction object.up (+Y by default).
	//
	//    Orbit - left mouse / touch: one-finger move

<script>( function () {

	/**
 * Description: A THREE loader for STL ASCII files, as created by Solidworks and other CAD programs.
 *
 * Supports both binary and ASCII encoded files, with automatic detection of type.
 *
 * The loader returns a non-indexed buffer geometry.
 *
 * Limitations:
 *  Binary decoding supports "Magics" color format (http://en.wikipedia.org/wiki/STL_(file_format)#Color_in_binary_STL).
 *  There is perhaps some question as to how valid it is to always assume little-endian-ness.
 *  ASCII decoding assumes file is UTF-8.
 *
 * Usage:
 *  const loader = new STLLoader();
 *  loader.load( './models/stl/slotted_disk.stl', function ( geometry ) {
 *    scene.add( new THREE.Mesh( geometry ) );
 *  });
 *
 * For binary STLs geometry might contain colors for vertices. To use it:
 *  // use the same code to load STL as above
 *  if (geometry.hasColors) {
 *    material = new THREE.MeshPhongMaterial({ opacity: geometry.alpha, vertexColors: true });
 *  } else { .... }
 *  const mesh = new THREE.Mesh( geometry, material );
 *
 * For ASCII STLs containing multiple solids, each solid is assigned to a different group.
 * Groups can be used to assign a different color by defining an array of materials with the same length of
 * geometry.groups and passing it to the Mesh constructor:
 *
 * const mesh = new THREE.Mesh( geometry, material );
 *
 * For example:
 *
 *  const materials = [];
 *  const nGeometryGroups = geometry.groups.length;
 *
 *  const colorMap = ...; // Some logic to index colors.
 *
 *  for (let i = 0; i < nGeometryGroups; i++) {
 *
 *		const material = new THREE.MeshPhongMaterial({
 *			color: colorMap[i],
 *			wireframe: false
 *		});
 *
 *  }
 *
 *  materials.push(material);
 *  const mesh = new THREE.Mesh(geometry, materials);
 */

	class STLLoader extends THREE.Loader {

		constructor( manager ) {

			super( manager );

		}
		load( url, onLoad, onProgress, onError ) {

			const scope = this;
			const loader = new THREE.FileLoader( this.manager );
			loader.setPath( this.path );
			loader.setResponseType( 'arraybuffer' );
			loader.setRequestHeader( this.requestHeader );
			loader.setWithCredentials( this.withCredentials );
			loader.load( url, function ( text ) {

				try {

					onLoad( scope.parse( text ) );

				} catch ( e ) {

					if ( onError ) {

						onError( e );

					} else {

						console.error( e );

					}

					scope.manager.itemError( url );

				}

			}, onProgress, onError );

		}
		parse( data ) {

			function isBinary( data ) {

				const reader = new DataView( data );
				const face_size = 32 / 8 * 3 + 32 / 8 * 3 * 3 + 16 / 8;
				const n_faces = reader.getUint32( 80, true );
				const expect = 80 + 32 / 8 + n_faces * face_size;
				if ( expect === reader.byteLength ) {

					return true;

				}

				// An ASCII STL data must begin with 'solid ' as the first six bytes.
				// However, ASCII STLs lacking the SPACE after the 'd' are known to be
				// plentiful.  So, check the first 5 bytes for 'solid'.

				// Several encodings, such as UTF-8, precede the text with up to 5 bytes:
				// https://en.wikipedia.org/wiki/Byte_order_mark#Byte_order_marks_by_encoding
				// Search for "solid" to start anywhere after those prefixes.

				// US-ASCII ordinal values for 's', 'o', 'l', 'i', 'd'

				const solid = [ 115, 111, 108, 105, 100 ];
				for ( let off = 0; off < 5; off ++ ) {

					// If "solid" text is matched to the current offset, declare it to be an ASCII STL.

					if ( matchDataViewAt( solid, reader, off ) ) return false;

				}

				// Couldn't find "solid" text at the beginning; it is binary STL.

				return true;

			}

			function matchDataViewAt( query, reader, offset ) {

				// Check if each byte in query matches the corresponding byte from the current offset

				for ( let i = 0, il = query.length; i < il; i ++ ) {

					if ( query[ i ] !== reader.getUint8( offset + i ) ) return false;

				}

				return true;

			}

			function parseBinary( data ) {

				const reader = new DataView( data );
				const faces = reader.getUint32( 80, true );
				let r,
					g,
					b,
					hasColors = false,
					colors;
				let defaultR, defaultG, defaultB, alpha;

				// process STL header
				// check for default color in header ("COLOR=rgba" sequence).

				for ( let index = 0; index < 80 - 10; index ++ ) {

					if ( reader.getUint32( index, false ) == 0x434F4C4F /*COLO*/ && reader.getUint8( index + 4 ) == 0x52 /*'R'*/ && reader.getUint8( index + 5 ) == 0x3D /*'='*/ ) {

						hasColors = true;
						colors = new Float32Array( faces * 3 * 3 );
						defaultR = reader.getUint8( index + 6 ) / 255;
						defaultG = reader.getUint8( index + 7 ) / 255;
						defaultB = reader.getUint8( index + 8 ) / 255;
						alpha = reader.getUint8( index + 9 ) / 255;

					}

				}

				const dataOffset = 84;
				const faceLength = 12 * 4 + 2;
				const geometry = new THREE.BufferGeometry();
				const vertices = new Float32Array( faces * 3 * 3 );
				const normals = new Float32Array( faces * 3 * 3 );
				for ( let face = 0; face < faces; face ++ ) {

					const start = dataOffset + face * faceLength;
					const normalX = reader.getFloat32( start, true );
					const normalY = reader.getFloat32( start + 4, true );
					const normalZ = reader.getFloat32( start + 8, true );
					if ( hasColors ) {

						const packedColor = reader.getUint16( start + 48, true );
						if ( ( packedColor & 0x8000 ) === 0 ) {

							// facet has its own unique color

							r = ( packedColor & 0x1F ) / 31;
							g = ( packedColor >> 5 & 0x1F ) / 31;
							b = ( packedColor >> 10 & 0x1F ) / 31;

						} else {

							r = defaultR;
							g = defaultG;
							b = defaultB;

						}

					}

					for ( let i = 1; i <= 3; i ++ ) {

						const vertexstart = start + i * 12;
						const componentIdx = face * 3 * 3 + ( i - 1 ) * 3;
						vertices[ componentIdx ] = reader.getFloat32( vertexstart, true );
						vertices[ componentIdx + 1 ] = reader.getFloat32( vertexstart + 4, true );
						vertices[ componentIdx + 2 ] = reader.getFloat32( vertexstart + 8, true );
						normals[ componentIdx ] = normalX;
						normals[ componentIdx + 1 ] = normalY;
						normals[ componentIdx + 2 ] = normalZ;
						if ( hasColors ) {

							colors[ componentIdx ] = r;
							colors[ componentIdx + 1 ] = g;
							colors[ componentIdx + 2 ] = b;

						}

					}

				}

				geometry.setAttribute( 'position', new THREE.BufferAttribute( vertices, 3 ) );
				geometry.setAttribute( 'normal', new THREE.BufferAttribute( normals, 3 ) );
				if ( hasColors ) {

					geometry.setAttribute( 'color', new THREE.BufferAttribute( colors, 3 ) );
					geometry.hasColors = true;
					geometry.alpha = alpha;

				}

				return geometry;

			}

			function parseASCII( data ) {

				const geometry = new THREE.BufferGeometry();
				const patternSolid = /solid([\s\S]*?)endsolid/g;
				const patternFace = /facet([\s\S]*?)endfacet/g;
				let faceCounter = 0;
				const patternFloat = /[\s]+([+-]?(?:\d*)(?:\.\d*)?(?:[eE][+-]?\d+)?)/.source;
				const patternVertex = new RegExp( 'vertex' + patternFloat + patternFloat + patternFloat, 'g' );
				const patternNormal = new RegExp( 'normal' + patternFloat + patternFloat + patternFloat, 'g' );
				const vertices = [];
				const normals = [];
				const normal = new THREE.Vector3();
				let result;
				let groupCount = 0;
				let startVertex = 0;
				let endVertex = 0;
				while ( ( result = patternSolid.exec( data ) ) !== null ) {

					startVertex = endVertex;
					const solid = result[ 0 ];
					while ( ( result = patternFace.exec( solid ) ) !== null ) {

						let vertexCountPerFace = 0;
						let normalCountPerFace = 0;
						const text = result[ 0 ];
						while ( ( result = patternNormal.exec( text ) ) !== null ) {

							normal.x = parseFloat( result[ 1 ] );
							normal.y = parseFloat( result[ 2 ] );
							normal.z = parseFloat( result[ 3 ] );
							normalCountPerFace ++;

						}

						while ( ( result = patternVertex.exec( text ) ) !== null ) {

							vertices.push( parseFloat( result[ 1 ] ), parseFloat( result[ 2 ] ), parseFloat( result[ 3 ] ) );
							normals.push( normal.x, normal.y, normal.z );
							vertexCountPerFace ++;
							endVertex ++;

						}

						// every face have to own ONE valid normal

						if ( normalCountPerFace !== 1 ) {

							console.error( 'THREE.STLLoader: Something isn\'t right with the normal of face number ' + faceCounter );

						}

						// each face have to own THREE valid vertices

						if ( vertexCountPerFace !== 3 ) {

							console.error( 'THREE.STLLoader: Something isn\'t right with the vertices of face number ' + faceCounter );

						}

						faceCounter ++;

					}

					const start = startVertex;
					const count = endVertex - startVertex;
					geometry.addGroup( start, count, groupCount );
					groupCount ++;

				}

				geometry.setAttribute( 'position', new THREE.Float32BufferAttribute( vertices, 3 ) );
				geometry.setAttribute( 'normal', new THREE.Float32BufferAttribute( normals, 3 ) );
				return geometry;

			}

			function ensureString( buffer ) {

				if ( typeof buffer !== 'string' ) {

					return THREE.LoaderUtils.decodeText( new Uint8Array( buffer ) );

				}

				return buffer;

			}

			function ensureBinary( buffer ) {

				if ( typeof buffer === 'string' ) {

					const array_buffer = new Uint8Array( buffer.length );
					for ( let i = 0; i < buffer.length; i ++ ) {

						array_buffer[ i ] = buffer.charCodeAt( i ) & 0xff; // implicitly assumes little-endian

					}

					return array_buffer.buffer || array_buffer;

				} else {

					return buffer;

				}

			}

			// start

			const binData = ensureBinary( data );
			return isBinary( binData ) ? parseBinary( binData ) : parseASCII( ensureString( data ) );

		}

	}

	THREE.STLLoader = STLLoader;

} )();

<script>
/* -*- coding: utf-8 -*- Agent CAD session replay demo. */
"use strict";

/* ================= data ================= */
const DATA = JSON.parse(document.getElementById("feed").textContent);
const MSGS = DATA.messages;
const STATS = DATA.stats;
const META = DATA.meta;
const CFG = DATA.config || {};
const N = MSGS.length;

/* stage range across role switches, e.g. "S1–S14" */
const stageRange = (() => {
  const sn = [];
  for (const m of MSGS) {
    if (m.role === "roleswitch") {
      const hit = (m.roleName + " " + (m.roleNote || "")).match(/S(\d+)/);
      if (hit) sn.push(+hit[1]);
    }
  }
  if (!sn.length) return "";
  const lo = Math.min(...sn), hi = Math.max(...sn);
  return lo === hi ? "S" + lo : "S" + lo + "–S" + hi;
})();
if (CFG.title) document.title = CFG.title + " · 会话回放 Demo";

const $ = (s, el) => (el || document).querySelector(s);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* stage tracking: last S-number seen in role switches up to each message */
let curStage = "";
for (const m of MSGS) {
  if (m.role === "roleswitch") {
    const hit = (m.roleName + " " + (m.roleNote || "")).match(/S(\d+)/);
    if (hit) curStage = "S" + hit[1];
  }
  m.stage = curStage;
}

function roleBadge(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("requirement") || n.includes("需求")) return { label: "需求确认", cls: "r-req" };
  if (n.includes("master")) return { label: "总体规划", cls: "r-plan" };
  if (n.includes("verifier planner") || n.includes("验证规划")) return { label: "验证规划", cls: "r-ver" };
  if (n.includes("builder") || n.includes("建模")) return { label: "建模执行", cls: "r-build" };
  if (n.includes("验证器")) return { label: "验证执行", cls: "r-ver" };
  return { label: name || "Agent", cls: "r-other" };
}

/* ================= mini markdown ================= */
function md(src) {
  const fences = [];
  let s = String(src == null ? "" : src);
  s = s.replace(/```(\w*)\n([\s\S]*?)(?:```|$)/g, (_, lang, code) => {
    fences.push({ lang, code });
    return "\u0000F" + (fences.length - 1) + "\u0000";
  });
  s = esc(s);
  const lines = s.split("\n");
  const out = [];
  let list = null, table = null, quote = false;
  const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  const closeTable = () => {
    if (table) { out.push("</tbody></table>"); table = null; }
  };
  const closeQuote = () => { if (quote) { out.push("</blockquote>"); quote = false; } };
  const inline = t => t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*\n]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  for (const raw of lines) {
    const line = raw;
    const fm = line.match(/^\u0000F(\d+)\u0000\s*$/);
    if (fm) { closeList(); closeTable(); closeQuote(); out.push(fenceHtml(fences[+fm[1]])); continue; }
    if (/^\s*$/.test(line)) { closeList(); closeTable(); closeQuote(); out.push(""); continue; }
    if (/^(---+|\*\*\*+)\s*$/.test(line)) { closeList(); closeTable(); closeQuote(); out.push("<hr>"); continue; }
    const hm = line.match(/^(#{1,4})\s+(.*)$/);
    if (hm) {
      closeList(); closeTable(); closeQuote();
      const lv = Math.min(4, hm[1].length + 2);
      out.push("<h" + lv + ">" + inline(hm[2]) + "</h" + lv + ">");
      continue;
    }
    if (/^&gt;\s?/.test(line)) {
      closeList(); closeTable();
      if (!quote) { out.push("<blockquote>"); quote = true; }
      out.push("<p>" + inline(line.replace(/^&gt;\s?/, "")) + "</p>");
      continue;
    }
    closeQuote();
    if (line.includes("|") && line.trim().startsWith("|")) {
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue; // separator row
      if (!table) { closeList(); out.push("<table><tbody>"); table = true; }
      out.push("<tr>" + cells.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>");
      continue;
    }
    closeTable();
    const um = line.match(/^\s*[-*]\s+(.*)$/);
    const om = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (um || om) {
      const want = um ? "ul" : "ol";
      if (list !== want) { closeList(); out.push("<" + want + ">"); list = want; }
      out.push("<li>" + inline((um || om)[1]) + "</li>");
      continue;
    }
    closeList();
    out.push("<p>" + inline(line) + "</p>");
  }
  closeList(); closeTable(); closeQuote();
  return out.join("\n");
}
function fenceHtml(f) {
  return '<div class="codebox"><div class="lab"><span>' + esc(f.lang || "text") +
    "</span><span>" + f.code.split("\n").length + " 行</span></div><pre>" + esc(f.code) + "</pre></div>";
}

/* ================= tool summaries ================= */
const TOOL_META = {
  bash: ["$", "bash"], write: ["✍", "write"], edit: ["✎", "edit"], read: ["📖", "read"],
  todowrite: ["☑", "todo"], grep: ["⌕", "grep"], glob: ["[])", "glob"],
  question: ["?", "question"], task: ["☱", "task"], skill: ["⚡", "skill"],
};
function toolSummary(b) {
  let inp = null;
  try { inp = b.input ? JSON.parse(b.input) : null; } catch (e) { inp = null; }
  let s = "";
  if (b.name === "bash") s = (inp && inp.command) || b.input || "";
  else if (inp && inp.filePath) {
    const base = String(inp.filePath).split("/").pop();
    let extra = "";
    if (b.name === "write" && inp.content) extra = " · " + (inp.content.length / 1000).toFixed(1) + "KB";
    if (b.name === "edit" && inp.oldString) extra = " · " + String(inp.oldString).split("\n").length + " 行替换";
    s = base + extra;
  } else if (b.name === "todowrite" && inp && inp.todos) s = inp.todos.length + " 项";
  else s = b.input ? String(b.input).replace(/\s+/g, " ").slice(0, 90) : "(无输入)";
  return { s: s.replace(/\s+/g, " ").slice(0, 110), inp };
}

/* ================= message DOM ================= */
const chat = $("#chat");
let showThink = true, showOut = true;

function buildBlocks(m, box, animated) {
  for (const b of m.blocks) {
    if (b.t === "text") {
      const d = el("div", "blk blk-text");
      const mdEl = el("div", "md");
      mdEl.innerHTML = md(b.md);
      d.appendChild(mdEl);
      box.appendChild(d);
    } else if (b.t === "think") {
      if (!showThink) continue;
      const det = el("details", "blk blk-think");
      const sum = el("summary", null, "思考过程 · " + b.md.length + " 字（点击展开）");
      const body = el("div", "thinkbody");
      body.innerHTML = md(b.md);
      det.append(sum, body);
      box.appendChild(det);
    } else if (b.t === "skill") {
      const det = el("details", "blk blk-skill");
      const sum = el("summary", null, "Skill 加载 · " + b.name + "（SKILL.md 全文）");
      const body = el("div", "skillbody");
      body.innerHTML = md(b.md);
      det.append(sum, body);
      box.appendChild(det);
    } else if (b.t === "code") {
      const d = el("div", "blk");
      d.innerHTML = fenceHtml(b);
      box.appendChild(d);
    } else if (b.t === "patch") {
      const p = el("div", "pill-patch");
      p.appendChild(el("span", "h", "✎ " + b.hash));
      for (const f of b.files) p.appendChild(el("span", "f", f.split("/").slice(-2).join("/")));
      box.appendChild(p);
    } else if (b.t === "tool") {
      box.appendChild(toolCard(b));
    }
  }
}
function toolCard(b) {
  const card = el("div", "toolcard" + (b.status === "error" ? " st-error" : ""));
  const meta = TOOL_META[b.name] || ["▪", b.name];
  const { s } = toolSummary(b);
  const row = el("div", "trow");
  row.append(
    el("span", "tico", meta[0]), el("span", "tname", meta[1]),
    el("span", "tstat st-" + b.status, b.status === "completed" ? "✓ done" : "✗ error"),
    el("span", "tsum", s)
  );
  if (b.input) row.appendChild(el("span", "tlen", "in " + (b.input.length / 1000).toFixed(1) + "k"));
  if (b.output) row.appendChild(el("span", "tlen", "out " + (b.output.length / 1000).toFixed(1) + "k"));
  row.appendChild(el("span", "chev", "▶"));
  const body = el("div", "toolbody");
  let built = false;
  const build = () => {
    if (built) return;
    built = true;
    if (b.input) {
      const d = el("div");
      d.innerHTML = '<div class="codebox"><div class="lab"><span>input · json</span></div><pre>' +
        esc(prettyJson(b.input)) + "</pre></div>";
      body.appendChild(d);
    }
    if (b.output) {
      const d = el("div");
      d.innerHTML = '<div class="codebox"><div class="lab"><span>output</span><span>' +
        b.output.split("\n").length + " 行</span></div><pre>" + esc(b.output) + "</pre></div>";
      d.style.display = showOut ? "" : "none";
      d.className = "tool-out";
      body.appendChild(d);
    }
    if (!b.input && !b.output) body.appendChild(el("div", null, "(无输入输出)"));
  };
  row.addEventListener("click", () => { card.classList.toggle("open"); build(); });
  card.append(row, body);
  return card;
}
function prettyJson(s) {
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return s; }
}

function renderMessage(m, opts) {
  opts = opts || {};
  if (m.role === "asst" && m.blocks.length === 0) return null; // 空 assistant 消息(原会话中内容为角色切换公告)
  if (m.role === "user") {
    const d = el("div", "msg user");
    d.dataset.i = m.i;
    const who = el("div", "who");
    who.append(el("span", "turnChip", "用户 · 第 " + m.userN + " 轮"));
    if (m.ts) who.appendChild(el("span", null, m.ts.slice(5)));
    const bub = el("div", "bubble");
    const txt = m.blocks.map(b => (b.t === "text" ? b.md : "")).join("\n").trim() || "(内容见下)";
    d.append(who, bub);
    chat.appendChild(d);
    if (opts.typing) {
      const tip = el("span", "typing", "");
      tip.innerHTML = "<i></i><i></i><i></i>";
      bub.appendChild(tip);
      typeInto(bub, txt, () => {});
    } else {
      bub.textContent = txt;
    }
    return d;
  }
  if (m.role === "roleswitch") {
    const rb = roleBadge(m.roleName);
    const d = el("div", "rolebanner");
    d.dataset.i = m.i;
    const pill = el("div", "pill");
    pill.append(el("span", null, "⟳ 角色切换"), el("span", "rbadge " + rb.cls, rb.label));
    const nm = el("span", null, m.roleName);
    nm.style.color = "#dbe4f3";
    pill.appendChild(nm);
    if (m.roleNote) pill.appendChild(el("span", null, "— " + m.roleNote));
    d.appendChild(pill);
    if (m.reading || m.artifact) {
      const meta = el("div", "meta");
      if (m.reading) meta.innerHTML += "读取 " + md(m.reading).replace(/^<p>|<\/p>$/g, "") + "　";
      if (m.artifact) meta.innerHTML += "产出 " + md(m.artifact).replace(/^<p>|<\/p>$/g, "");
      d.appendChild(meta);
    }
    chat.appendChild(d);
    if (m.blocks.length) {
      const am = el("div", "msg asst");
      am.dataset.i = m.i;
      const head = asstHead(m);
      const box = el("div", null);
      am.append(head, box);
      buildBlocks(m, box);
      chat.appendChild(am);
    }
    return d;
  }
  // assistant
  const d = el("div", "msg asst");
  d.dataset.i = m.i;
  const box = el("div", null);
  d.append(asstHead(m), box);
  buildBlocks(m, box);
  chat.appendChild(d);
  return d;
}
function asstHead(m) {
  const head = el("div", "head");
  head.appendChild(el("div", "avatar", "A"));
  const rb = roleBadge(m.curRole);
  head.appendChild(el("span", "rbadge " + rb.cls, rb.label));
  head.appendChild(el("span", "aname", "Agent"));
  head.appendChild(el("span", "modeltag", m.model || ""));
  if (m.stage) head.appendChild(el("span", "modeltag", m.stage));
  if (m.ts) head.appendChild(el("span", "mtime", m.ts.slice(5)));
  return head;
}

/* typing effect */
let typeTimer = null;
function typeInto(bub, txt, done) {
  clearInterval(typeTimer);
  const caret = el("span", "caret");
  bub.textContent = "";
  bub.appendChild(caret);
  let i = 0;
  const stepChars = Math.max(1, Math.round(3 * speed));
  typeTimer = setInterval(() => {
    i += stepChars;
    if (i >= txt.length) {
      clearInterval(typeTimer);
      bub.textContent = txt;
      done();
    } else {
      bub.textContent = txt.slice(0, i);
      bub.appendChild(caret);
    }
  }, 30);
}

/* ================= playback engine ================= */
let cursor = 0, playing = false, speed = 1, mode = "replay", follow = true, advanceTimer = null;

function delayFor(m) {
  let d = 260;
  if (m.role === "user") d = 1500;
  else if (m.role === "roleswitch") d = 900;
  else {
    let tools = 0, texts = 0;
    for (const b of m.blocks) { if (b.t === "tool") tools++; else if (b.t === "text") texts++; }
    d = 320 + tools * 380 + texts * 520 + (m.blocks.length - tools - texts) * 160;
    d = Math.min(d, 3400);
  }
  return d / speed;
}
function step() {
  if (!playing) return;
  if (cursor >= N) { setPlaying(false); return; }
  const m = MSGS[cursor++];
  const isUser = m.role === "user";
  renderMessage(m, { typing: isUser && speed < 99 });
  updateScrub();
  if (cursor >= N) { setPlaying(false); updateScrub(); return; }
  const d = delayFor(m);
  advanceTimer = setTimeout(step, d);
}
function setPlaying(p) {
  playing = p;
  $("#playBtn").textContent = p ? "⏸ 暂停" : "▶ 播放";
  if (!p) { clearTimeout(advanceTimer); clearInterval(typeTimer); }
}
function play() { setPlaying(true); step(); }
$("#playBtn").addEventListener("click", () => {
  if (playing) setPlaying(false);
  else { if (cursor >= N) seek(0); play(); }
});
$("#nextBtn").addEventListener("click", () => {
  setPlaying(false);
  const next = STATS.userIdx.find(i => i >= cursor);
  seek(next === undefined ? N - 1 : next);
  setPlaying(true); step();
});

/* seek: render [0..idx] instantly */
function seek(idx) {
  setPlaying(false);
  chat.querySelectorAll(".msg, .rolebanner").forEach(n => n.remove());
  cursor = Math.min(idx + 1, N);
  for (let i = 0; i < cursor; i++) renderMessage(MSGS[i], {});
  updateScrub();
  jumpBottom(true);
}

/* ================= scrubber ================= */
const scrub = $("#scrub"), scrubFill = $("#scrubFill"), scrubTip = $("#scrubTip"), scrubStat = $("#scrubStat");
function updateScrub() {
  scrubFill.style.width = (cursor / N * 100) + "%";
  const doneUsers = STATS.userIdx.filter(i => i < cursor).length;
  const m = MSGS[Math.max(0, cursor - 1)];
  scrubStat.innerHTML = "消息 <b>" + cursor + "</b> / " + N +
    "　·　用户轮 <b>" + doneUsers + "</b> / " + STATS.userTurns +
    (m && m.stage ? "　·　" + m.stage : "");
  const chip = $("#stageChip");
  chip.textContent = m && m.stage ? m.stage : "初始化";
  document.querySelectorAll(".mark").forEach((mk, k) => {
    mk.classList.toggle("lit", STATS.userIdx[k] < cursor);
  });
}
(function buildMarks() {
  STATS.userIdx.forEach((idx, k) => {
    const mk = el("div", "mark");
    mk.style.left = (idx / N * 100) + "%";
    const m = MSGS[idx];
    const txt = m.blocks.map(b => (b.t === "text" ? b.md : "")).join(" ").replace(/\s+/g, " ").slice(0, 60);
    mk.addEventListener("mouseenter", () => {
      scrubTip.style.display = "block";
      scrubTip.style.left = mk.style.left;
      scrubTip.innerHTML = '<div class="t">第 ' + m.userN + ' 轮 · ' + (m.ts || "").slice(5) + " · 点击跳转</div>" + esc(txt);
    });
    mk.addEventListener("mouseleave", () => { scrubTip.style.display = "none"; });
    mk.addEventListener("click", e => { e.stopPropagation(); seek(idx); setPlaying(true); step(); });
    scrub.appendChild(mk);
  });
})();
function scrubPos(e) {
  const r = scrub.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  return Math.round(frac * (N - 1));
}
scrub.addEventListener("click", e => { const i = scrubPos(e); seek(i); });
let scrubDrag = false;
scrub.addEventListener("pointerdown", e => { scrubDrag = true; scrub.setPointerCapture(e.pointerId); });
scrub.addEventListener("pointermove", e => {
  if (scrubDrag) { const i = scrubPos(e); scrubFill.style.width = (i / N * 100) + "%"; }
});
scrub.addEventListener("pointerup", e => {
  if (scrubDrag) { scrubDrag = false; seek(scrubPos(e)); }
});

/* ================= chat scroll / follow ================= */
const chatWrap = $("#chatWrap");
chatWrap.addEventListener("scroll", () => {
  const away = chatWrap.scrollHeight - chatWrap.scrollTop - chatWrap.clientHeight > 140;
  follow = !away;
  $("#followPill").style.display = away ? "block" : "none";
});
$("#followPill").addEventListener("click", () => { jumpBottom(true); follow = true; $("#followPill").style.display = "none"; });
function jumpBottom(smooth) {
  chatWrap.scrollTo({ top: chatWrap.scrollHeight, behavior: smooth ? "smooth" : "auto" });
}
const _origAppend = chat.appendChild.bind(chat);
chat.appendChild = node => { _origAppend(node); if (follow) jumpBottom(false); return node; };

/* ================= controls ================= */
$("#modeSeg").addEventListener("click", e => {

$("#speedSeg").addEventListener("click", e => {

$("#tglThink").addEventListener("click", e => {

$("#tglOut").addEventListener("click", e => {

$("#sideToggle").addEventListener("click", () => $("#side").classList.toggle("show"));
document.addEventListener("keydown", e => {

/* ================= tabs ================= */
$("#tabs").addEventListener("click", e => {

(function outTab() {

    '<p><b>操作</b>：<span class="kbd">空格</span> 播放/暂停 · <span class="kbd">⇧→</span> 跳到下一轮用户输入 · 点击进度条橙色刻度直达对应轮次 · 速度可调（×0.5–∞）·「阅读模式」一次渲染全部。</p>' +
    '<p style="color:var(--ink-faint);font-size:11.5px">会话 ' + esc(META.id) + " · 由 examples/demo_kit 从 transcript 自动生成本页</p></div>";
})();

/* ================= session card ================= */

    '<div class="statGrid">' +
    '<div class="stat"><b>' + N + "</b><span>消息总数</span></div>" +
    '<div class="stat"><b>' + STATS.userTurns + "</b><span>用户输入轮次</span></div>" +
    (stageRange ? '<div class="stat"><b>' + stageRange + "</b><span>建模阶段</span></div>" : "") +
    '<div class="stat"><b>' + STATS.toolTotal + "</b><span>工具调用</span></div>" +
    '<div class="stat"><b>' + STATS.allPass + "</b><span>验证 ALL PASS</span></div>" +
    '<div class="stat err"><b>' + (STATS.tools.edit || 0) + "</b><span>次编辑迭代</span></div>" +
    extra +
    "</div>";
  $("#metaLine").textContent = META.title + " · " + STATS.userTurns + " 轮用户输入 · " + STATS.toolTotal + " 次工具调用" + (stageRange ? " · " + stageRange : "");
})();

/* ================= three.js viewer ================= */
let glOK = false, renderer, scene, camera, controls, mesh, gridHelper, camTween = null;
const glCanvas = $("#gl");
function b64ToBuf(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
function glInit() {
  try {
    renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(38, 1, 1, 5000);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3350, 0.95));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(160, 240, 180);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x88aaff, 0.45);
    rim.position.set(-180, -40, -160);
    scene.add(rim);
    const geo = new THREE.STLLoader().parse(b64ToBuf(CFG.stl.b64));
    geo.computeBoundingBox();
    const bb = geo.boundingBox, size = new THREE.Vector3();
    bb.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = 150 / maxDim;
    geo.center();
    geo.translate(0, size.y * scale / 2, 0);
    geo.scale(scale, scale, scale);
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: 0xccd8ea, metalness: 0.32, roughness: 0.4 });
    mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);
    gridHelper = new THREE.GridHelper(420, 42, 0x33415e, 0x1a2338);
    scene.add(gridHelper);
    controls = new THREE.OrbitControls(camera, glCanvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.5;
    controls.target.set(0, 30, 0);
    setView("iso", true);
    glOK = true;
    $("#glLoad").style.display = "none";
    glResize();
    renderer.setAnimationLoop(glLoop);
  } catch (e) {
    $("#glLoad").textContent = "3D 初始化失败：" + e.message;
  }
}
const VIEWS = {
  iso: { t: 0.72, p: 1.05, d: 340 },
  front: { t: Math.PI / 2, p: Math.PI / 2 - 0.02, d: 360 },
  top: { t: 0.0001, p: 0.28, d: 380 },
};
function setView(name, instant) {
  const v = VIEWS[name];
  const pos = new THREE.Vector3().setFromSphericalCoords(v.d, v.p, v.t).add(controls.target);
  if (instant) { camera.position.copy(pos); controls.update(); camTween = null; }
  else camTween = { pos, left: 18 };
}
function glLoop() {
  if (!glOK) return;
  if (camTween) {
    camera.position.lerp(camTween.pos, 0.14);
    camTween.left--;
    if (camera.position.distanceTo(camTween.pos) < 1.5 || camTween.left <= 0) camTween = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
function glResize() {
  if (!glOK) return;
  const w = glCanvas.clientWidth || 1, h = glCanvas.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(glResize).observe($("#glWrap"));
$("#glBar").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const act = b.dataset.a;
  if (act === "rotate") { controls.autoRotate = !controls.autoRotate; b.classList.toggle("on", controls.autoRotate); }
  else if (act === "wire") { mesh.material.wireframe = !mesh.material.wireframe; b.classList.toggle("on", mesh.material.wireframe); }
  else if (act === "reset") { setView("iso"); $("#glBar [data-a=rotate]").classList.add("on"); controls.autoRotate = true; mesh.material.wireframe = false; }
  else setView(act);
});
glInit();
(function glCaption() {
  const c = $("#glCap");
  if (c && CFG.stl && CFG.stl.glCap) c.textContent = CFG.stl.glCap;
})();

/* ================= boot ================= */
updateScrub();
renderMessage(MSGS[0], { typing: false }); // 第一条用户需求先呈上
cursor = 1;
updateScrub();

</script>
